interface:
  display_name: "Linear"
  short_description: "Read, create, investigate, and update Linear work"
  default_prompt: "Use $linear to handle this Linear request and keep the issue body current."

dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Authenticated Linear MCP server"
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp"

policy:
  allow_implicit_invocation: true
